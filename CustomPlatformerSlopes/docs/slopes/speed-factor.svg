<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img">
<!-- Figure for CustomPlatformerSlopes (style of Slope in SimplePlatformer). See README.md. -->
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.t { font-size: 13px; font-weight: 500; fill: #1A1F22; }
.ts { font-size: 12px; fill: #5E676D; }
.tm { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1A1F22; }
.tmb { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; fill: #1A1F22; }
.halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
.slope { fill: #B9481A; fill-opacity: .16; }
.sline { stroke: #B9481A; stroke-width: 2; fill: none; stroke-linecap: round; }
.ext { stroke: #B9481A; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.band { stroke: #DD9216; stroke-width: 10; stroke-opacity: .28; stroke-linecap: round; }
.body { fill: #DCE7FA; stroke: #2E64C2; stroke-width: 1.2; }
.next { fill: none; stroke: #2E64C2; stroke-width: 1.4; stroke-dasharray: 4 3; }
.bad { fill: none; stroke: #CC3333; stroke-width: 1.4; stroke-dasharray: 4 3; }
.plan { fill: none; stroke: #5E676D; stroke-width: 1.3; stroke-dasharray: 4 3; }
.solid { fill: #E3E7E8; stroke: #8B9498; stroke-width: .8; }
.foot { fill: #DD9216; }
.dot-mute { fill: #5E676D; } .dot-bad { fill: #CC3333; } .dot-body { fill: #2E64C2; } .dot-brick { fill: #B9481A; }
.ring { fill: none; stroke: #CC3333; stroke-width: 1.5; }
.lead { stroke: #5E676D; stroke-width: .8; stroke-dasharray: 2 3; fill: none; }
.guide { stroke: #5E676D; stroke-width: .9; stroke-dasharray: 3 3; fill: none; }
.sep { stroke: #D9DEDD; stroke-width: 1; stroke-dasharray: 2 4; }
.gridl { stroke: #E8ECEC; stroke-width: 1; }
.a-mute { stroke: #5E676D; stroke-width: 1.5; fill: none; }
.a-body { stroke: #2E64C2; stroke-width: 1.6; fill: none; }
.a-bad { stroke: #CC3333; stroke-width: 1.5; fill: none; }
.a-foot { stroke: #DD9216; stroke-width: 1.8; fill: none; }
.a-brick { stroke: #B9481A; stroke-width: 1.5; fill: none; }
.dash { stroke-dasharray: 4 3; }
.mk-mute { fill: none; stroke: #5E676D; } .mk-body { fill: none; stroke: #2E64C2; } .mk-bad { fill: none; stroke: #CC3333; }
.mk-foot { fill: none; stroke: #DD9216; } .mk-brick { fill: none; stroke: #B9481A; }
.mk { stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.bx-eng { fill: #F1F3F2; stroke: #A9B1B3; stroke-width: .8; }
.bx-slope { fill: #F8E4D9; stroke: #B9481A; stroke-width: .8; }
.cont { fill: none; stroke: #B9481A; stroke-width: 1; stroke-dasharray: 5 4; }
.bar-mute { fill: #8B9498; } .bar-body { fill: #2E64C2; } .bar-ok { fill: #1F8A68; } .bar-bad { fill: #CC3333; fill-opacity: .8; }
.cell-ok { fill: #1F8A68; fill-opacity: .85; } .cell-bad { fill: #CC3333; fill-opacity: .85; }

</style>
<defs>
<marker id="m-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-mute" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-body" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-body" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-bad" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-foot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-foot" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-brick" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-brick" d="M2 1L8 5L2 9"></path></marker>
</defs>
<rect width="680" height="350" fill="#FFFFFF"/>
<title>speedFactor</title><desc>Moltiplicatori orizzontali costanti: 0.8 in salita e 1.3 in discesa con comando concorde, 1 in frenata; senza comando la discesa usa IdleDownhillMultiplier e lo scivolamento da fermo la velocità massima in piano.</desc><polygon class="slope" points="50.0,260.0 350.0,130.0 350.0,260.0"/><line class="sline" x1="50.0" y1="260.0" x2="350.0" y2="130.0"/><line class="a-body" x1="110.0" y1="224.0" x2="250.0" y2="163.0" marker-end="url(#m-body)"/><line class="a-body dash" x1="310.0" y1="113.0" x2="170.0" y2="174.0" marker-end="url(#m-body)"/><text class="ts" x="180.0" y="255.0" text-anchor="start" dominant-baseline="central">salita × 0.8</text><text class="ts" x="90.0" y="110.0" text-anchor="start" dominant-baseline="central">discesa × 1.3</text><text class="ts" x="200.0" y="282.0" text-anchor="middle" dominant-baseline="central">i fattori non dipendono dalla pendenza</text><text class="t" x="410.0" y="40.0" text-anchor="start" dominant-baseline="central">situazione</text><text class="t" x="630.0" y="40.0" text-anchor="end" dominant-baseline="central">xFactor</text><line class="sep" x1="410.0" y1="54.0" x2="650.0" y2="54.0"/><text class="t" x="410.0" y="72.0" text-anchor="start" dominant-baseline="central">comando</text><text class="ts" x="410.0" y="94.0" text-anchor="start" dominant-baseline="central">concorde in salita</text><text class="tm" x="630.0" y="94.0" text-anchor="end" dominant-baseline="central">0.8</text><text class="tm" x="418.0" y="109.0" text-anchor="start" dominant-baseline="central">UphillMultiplier</text><text class="ts" x="410.0" y="131.0" text-anchor="start" dominant-baseline="central">concorde in discesa</text><text class="tm" x="630.0" y="131.0" text-anchor="end" dominant-baseline="central">1.3</text><text class="tm" x="418.0" y="146.0" text-anchor="start" dominant-baseline="central">DownhillMultiplier</text><text class="ts" x="410.0" y="168.0" text-anchor="start" dominant-baseline="central">in frenata (skidding)</text><text class="tm" x="630.0" y="168.0" text-anchor="end" dominant-baseline="central">1</text><text class="tm" x="418.0" y="183.0" text-anchor="start" dominant-baseline="central">body.skidding()</text><text class="t" x="410.0" y="205.0" text-anchor="start" dominant-baseline="central">nessun comando</text><text class="ts" x="410.0" y="227.0" text-anchor="start" dominant-baseline="central">inerzia in salita</text><text class="tm" x="630.0" y="227.0" text-anchor="end" dominant-baseline="central">1</text><text class="tm" x="418.0" y="242.0" text-anchor="start" dominant-baseline="central">+ frenata extra</text><text class="ts" x="410.0" y="264.0" text-anchor="start" dominant-baseline="central">inerzia in discesa</text><text class="tm" x="630.0" y="264.0" text-anchor="end" dominant-baseline="central">1.0</text><text class="tm" x="418.0" y="279.0" text-anchor="start" dominant-baseline="central">IdleDownhillMultiplier</text><text class="ts" x="410.0" y="301.0" text-anchor="start" dominant-baseline="central">da fermo: scivolamento</text><text class="tm" x="630.0" y="301.0" text-anchor="end" dominant-baseline="central">—</text><text class="tm" x="418.0" y="316.0" text-anchor="start" dominant-baseline="central">vx = maxSpeedX × 1.0</text></svg>
