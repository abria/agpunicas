<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img">
<!-- Figure for CustomPlatformerSlopes (style of Slope in SimplePlatformer). See README.md. -->
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.t { font-size: 13px; font-weight: 500; fill: #1A1F22; }
.ts { font-size: 12px; fill: #5E676D; }
.tm { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #1A1F22; }
.tmb { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; fill: #1A1F22; }
.halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
.slope { fill: #B9481A; fill-opacity: .16; }
.sline { stroke: #B9481A; stroke-width: 2; fill: none; stroke-linecap: round; }
.ext { stroke: #B9481A; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.band { stroke: #DD9216; stroke-width: 10; stroke-opacity: .28; stroke-linecap: round; }
.body { fill: #DCE7FA; stroke: #2E64C2; stroke-width: 1.2; }
.next { fill: none; stroke: #2E64C2; stroke-width: 1.4; stroke-dasharray: 4 3; }
.bad { fill: none; stroke: #CC3333; stroke-width: 1.4; stroke-dasharray: 4 3; }
.plan { fill: none; stroke: #5E676D; stroke-width: 1.3; stroke-dasharray: 4 3; }
.solid { fill: #E3E7E8; stroke: #8B9498; stroke-width: .8; }
.foot { fill: #DD9216; }
.dot-mute { fill: #5E676D; } .dot-bad { fill: #CC3333; } .dot-body { fill: #2E64C2; } .dot-brick { fill: #B9481A; }
.ring { fill: none; stroke: #CC3333; stroke-width: 1.5; }
.lead { stroke: #5E676D; stroke-width: .8; stroke-dasharray: 2 3; fill: none; }
.guide { stroke: #5E676D; stroke-width: .9; stroke-dasharray: 3 3; fill: none; }
.sep { stroke: #D9DEDD; stroke-width: 1; stroke-dasharray: 2 4; }
.gridl { stroke: #E8ECEC; stroke-width: 1; }
.a-mute { stroke: #5E676D; stroke-width: 1.5; fill: none; }
.a-body { stroke: #2E64C2; stroke-width: 1.6; fill: none; }
.a-bad { stroke: #CC3333; stroke-width: 1.5; fill: none; }
.a-foot { stroke: #DD9216; stroke-width: 1.8; fill: none; }
.a-brick { stroke: #B9481A; stroke-width: 1.5; fill: none; }
.dash { stroke-dasharray: 4 3; }
.mk-mute { fill: none; stroke: #5E676D; } .mk-body { fill: none; stroke: #2E64C2; } .mk-bad { fill: none; stroke: #CC3333; }
.mk-foot { fill: none; stroke: #DD9216; } .mk-brick { fill: none; stroke: #B9481A; }
.mk { stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.bx-eng { fill: #F1F3F2; stroke: #A9B1B3; stroke-width: .8; }
.bx-slope { fill: #F8E4D9; stroke: #B9481A; stroke-width: .8; }
.cont { fill: none; stroke: #B9481A; stroke-width: 1; stroke-dasharray: 5 4; }
.bar-mute { fill: #8B9498; } .bar-body { fill: #2E64C2; } .bar-ok { fill: #1F8A68; } .bar-bad { fill: #CC3333; fill-opacity: .8; }
.cell-ok { fill: #1F8A68; fill-opacity: .85; } .cell-bad { fill: #CC3333; fill-opacity: .85; }

</style>
<defs>
<marker id="m-mute" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-mute" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-body" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-body" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-bad" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-foot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-foot" d="M2 1L8 5L2 9"></path></marker>
<marker id="m-brick" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk mk-brick" d="M2 1L8 5L2 9"></path></marker>
</defs>
<rect width="680" height="330" fill="#FFFFFF"/>
<title>restingInValley</title><desc>Due rampe opposte formano una valle; per effetto della penetrazione affusolata le quote di appoggio sono piane al fondo e il corpo resta fermo senza oscillare.</desc><polygon class="slope" points="100.0,110.0 340.0,230.0 100.0,230.0"/><polygon class="slope" points="340.0,230.0 580.0,110.0 580.0,230.0"/><line class="sline" x1="100.0" y1="110.0" x2="340.0" y2="230.0"/><line class="sline" x1="340.0" y1="230.0" x2="580.0" y2="110.0"/><polyline class="a-foot" points="100.0,110.0 140.0,150.0 300.0,230.0 340.0,230.0"/><polyline class="a-foot" points="340.0,230.0 380.0,230.0 540.0,150.0 580.0,110.0"/><rect x="300.0" y="224.0" width="80.0" height="12" fill="#1F8A68" fill-opacity=".18"/><rect class="body" x="320.0" y="150.0" width="48.0" height="80.0" rx="2"/><circle class="foot" cx="320.0" cy="230.0" r="5"/><circle class="foot" cx="368.0" cy="230.0" r="5"/><text class="ts" x="312.0" y="254.0" text-anchor="end" dominant-baseline="central">piede a monte di A</text><text class="ts" x="376.0" y="254.0" text-anchor="start" dominant-baseline="central">piede a monte di B</text><text class="tmb" x="180.0" y="108.0" text-anchor="middle" dominant-baseline="central">A</text><text class="tmb" x="500.0" y="108.0" text-anchor="middle" dominant-baseline="central">B</text><text class="t" x="340.0" y="282.0" text-anchor="middle" dominant-baseline="central">zona piana condivisa: supportY = bottom per A e per B</text><text class="tm" x="340.0" y="302.0" text-anchor="middle" dominant-baseline="central">restingInValley → velocità di scivolamento 0</text><text class="tmb" x="340.0" y="26.0" text-anchor="middle" dominant-baseline="central">valle fra rampe opposte (s = 0.5, penetrazione 0.25)</text><text class="ts" x="340.0" y="48.0" text-anchor="middle" dominant-baseline="central">ogni rampa ha un tratto piano largo 0.25 / s = 0.5 al piede: insieme formano 1 unità</text></svg>
